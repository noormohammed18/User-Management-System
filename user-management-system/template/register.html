<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f0f2f5;
               display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 40px; border-radius: 12px;
                box-shadow: 0 4px 16px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { text-align: center; color: #333; margin-bottom: 6px; }
        p.subtitle { text-align: center; color: #888; margin-bottom: 24px; font-size: 14px; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: bold; }
        input { display: block; width: 100%; padding: 10px 14px; margin-bottom: 16px;
                border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        input:focus { outline: none; border-color: #007bff; }
        button { width: 100%; padding: 12px; background: #28a745; color: white;
                 border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
        button:hover { background: #1e7e34; }
        .msg-error { background: #f8d7da; color: #721c24; padding: 10px 14px;
                     border-radius: 6px; margin-bottom: 16px; font-size: 13px; text-align: center; }
        .footer-text { text-align: center; margin-top: 20px; font-size: 13px; color: #888; }
        .footer-text a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Create Account</h1>
        <p class="subtitle">Register a new account</p>
        {{if .Error}}
            <div class="msg-error">{{.Error}}</div>
        {{end}}
        <form action="/register" method="POST">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="John Doe" required />
            <label>Email Address</label>
            <input type="email" name="email" placeholder="you@example.com" required />
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required />
            <label>Age</label>
            <input type="number" name="age" placeholder="25" required />
            <button type="submit">Register</button>
        </form>
        <p class="footer-text">Already have an account? <a href="/login">Sign In</a></p>
    </div>
</body>
</html>
