<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f0f2f5;
               display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 40px; border-radius: 12px;
                box-shadow: 0 4px 16px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { text-align: center; color: #333; margin-bottom: 6px; font-size: 24px; }
        p.subtitle { text-align: center; color: #888; margin-bottom: 24px; font-size: 14px; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: bold; }
        input[type="text"] { display: block; width: 100%; padding: 10px 14px; margin-bottom: 16px;
                border: 1px solid #ccc; border-radius: 6px; font-size: 20px;
                letter-spacing: 8px; text-align: center; }
        input:focus { outline: none; border-color: #007bff; }
        button { width: 100%; padding: 12px; background: #007bff; color: white;
                 border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .msg-error { background: #f8d7da; color: #721c24; padding: 10px 14px;
                     border-radius: 6px; margin-bottom: 16px; font-size: 13px; text-align: center; }
        .footer-text { text-align: center; margin-top: 20px; font-size: 13px; color: #888; }
        .footer-text a { color: #007bff; text-decoration: none; }
        .icon { text-align: center; font-size: 40px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📧</div>
        <h1>Verify OTP</h1>
        <p class="subtitle">Enter the 6-digit code sent to<br><strong>{{.Email}}</strong></p>
        {{if .Error}}
            <div class="msg-error">{{.Error}}</div>
        {{end}}
        <form method="POST" action="/verify-otp">
            <input type="hidden" name="email" value="{{.Email}}" />
            <label>OTP Code</label>
            <input type="text" name="otp" placeholder="000000" maxlength="6" required />
            <button type="submit">Verify OTP</button>
        </form>
        <p class="footer-text"><a href="/forgot-password">← Resend OTP</a></p>
    </div>
</body>
</html>
