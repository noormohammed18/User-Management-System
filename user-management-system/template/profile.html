<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; }
        .navbar { background: #007bff; padding: 16px 32px;
                  display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { color: white; font-size: 20px; }
        .navbar a { color: white; text-decoration: none; background: rgba(255,255,255,0.2);
                    padding: 8px 16px; border-radius: 6px; font-size: 14px; margin-left: 8px; }
        .navbar a:hover { background: rgba(255,255,255,0.35); }
        .container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; padding: 32px; border-radius: 12px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; }
        .avatar { width: 80px; height: 80px; background: #007bff; border-radius: 50%;
                  display: flex; align-items: center; justify-content: center;
                  font-size: 32px; color: white; margin: 0 auto 20px; }
        h2 { color: #333; margin-bottom: 8px; }
        .email { color: #888; font-size: 14px; margin-bottom: 20px; }
        .role-badge { display: inline-block; padding: 6px 18px; border-radius: 20px;
                      font-size: 13px; font-weight: bold; margin-bottom: 24px; }
        .role-admin { background: #fff3cd; color: #856404; }
        .role-user  { background: #d1ecf1; color: #0c5460; }
        .info-row { display: flex; justify-content: space-between;
                    padding: 12px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #888; }
        .info-value { color: #333; font-weight: bold; }
        .btn { display: inline-block; margin-top: 24px; padding: 10px 24px;
               background: #007bff; color: white; text-decoration: none;
               border-radius: 6px; font-size: 14px; }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>👥 User Management</h1>
        <div>
            <a href="/users">Users</a>
            <a href="/logout">Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <div class="avatar">👤</div>
            <h2>{{.CurrentUser.Name}}</h2>
            <p class="email">{{.CurrentUser.Email}}</p>

            {{if .CurrentUser.IsAdmin}}
                <span class="role-badge role-admin">⭐ Admin</span>
            {{else}}
                <span class="role-badge role-user">👤 User</span>
            {{end}}

            <div class="info-row">
                <span class="info-label">ID</span>
                <span class="info-value">#{{.CurrentUser.ID}}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Age</span>
                <span class="info-value">{{.CurrentUser.Age}}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Role</span>
                <span class="info-value">
                    {{if .CurrentUser.IsAdmin}}Administrator{{else}}Regular User{{end}}
                </span>
            </div>

            <a href="/users" class="btn">Go to Users Page</a>
        </div>
    </div>
</body>
</html>
