<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f0f2f5;
               display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 40px; border-radius: 12px;
                box-shadow: 0 4px 16px rgba(0,0,0,0.1); width: 100%; max-width: 440px; }
        h1 { color: #333; margin-bottom: 24px; font-size: 22px; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: bold; }
        input { display: block; width: 100%; padding: 10px 14px; margin-bottom: 16px;
                border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        input:focus { outline: none; border-color: #007bff; }
        .btn-row { display: flex; gap: 12px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
        .btn-save   { background: #007bff; color: white; }
        .btn-save:hover { background: #0056b3; }
        .btn-cancel { background: #6c757d; color: white; }
        .btn-cancel:hover { background: #545b62; }
    </style>
</head>
<body>
    <div class="card">
        <h1>✏️ Edit User</h1>
        <form action="/update-user?id={{.CurrentUser.ID}}" method="POST">
            <label>Full Name</label>
            <input type="text"   name="name"  value="{{.CurrentUser.Name}}"  required />
            <label>Email Address</label>
            <input type="email"  name="email" value="{{.CurrentUser.Email}}" required />
            <label>Age</label>
            <input type="number" name="age"   value="{{.CurrentUser.Age}}"   required />
            <div class="btn-row">
                <button type="submit" class="btn-save">Save Changes</button>
                <a href="/users"><button type="button" class="btn-cancel">Cancel</button></a>
            </div>
        </form>
    </div>
</body>
</html>
